name: Build MH Analysis V.07 APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      MH_ANDROID_KEYSTORE_B64: ${{ secrets.MH_ANDROID_KEYSTORE_B64 }}
      MH_ANDROID_STORE_PASSWORD: ${{ secrets.MH_ANDROID_STORE_PASSWORD }}
      MH_ANDROID_KEY_ALIAS: ${{ secrets.MH_ANDROID_KEY_ALIAS }}
      MH_ANDROID_KEY_PASSWORD: ${{ secrets.MH_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: python3 scripts/patch_v01_compile_fix.py
      - run: python3 scripts/patch_v01_calendar_news.py
      - run: python3 scripts/patch_v03_manual_pack_fix.py
      - run: python3 scripts/patch_v04_isolate_manual_pack.py
      - run: python3 scripts/patch_v05_two_call_pack.py
      - run: python3 scripts/patch_v06_ui_support.py
      - run: python3 scripts/patch_v07_synced_cooldown_ui.py
      - name: Validate V.06 preserved analysis stack
        run: python3 scripts/validate_v06_ui_stack.py
      - name: Validate V.07 synchronized timer UI
        run: python3 scripts/validate_v07_ui.py

      - name: Use canonical PC MH logo
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/src/main/res/drawable/mh_logo_pc.xml
          curl -fsSL "https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/v56.3-release/web/mh-logo.png" -o app/src/main/res/drawable/mh_logo_pc.png
          test -s app/src/main/res/drawable/mh_logo_pc.png

      - name: Validate permanent signing secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MH_ANDROID_KEYSTORE_B64" || { echo 'Missing MH_ANDROID_KEYSTORE_B64'; exit 1; }
          test -n "$MH_ANDROID_STORE_PASSWORD" || { echo 'Missing MH_ANDROID_STORE_PASSWORD'; exit 1; }
          test -n "$MH_ANDROID_KEY_ALIAS" || { echo 'Missing MH_ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$MH_ANDROID_KEY_PASSWORD" || { echo 'Missing MH_ANDROID_KEY_PASSWORD'; exit 1; }

      - name: Prepare permanent release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/mh-analysis-release.jks"
          printf '%s' "$MH_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "MH_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$MH_ANDROID_STORE_PASSWORD" -alias "$MH_ANDROID_KEY_ALIAS" >/dev/null

      - name: Build debug validation APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: gradle --no-daemon assembleDebug

      - name: Upload V.07 debug validation APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.07-Debug-Validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build permanently signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature and certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          cp "$APK" MH-Analysis-V.07.apk

      - name: Upload signed V.07 artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.07-Signed-APK
          path: MH-Analysis-V.07.apk
          if-no-files-found: error

      - name: Publish signed mobile update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          HASH=$(sha256sum MH-Analysis-V.07.apk | awk '{print $1}')
          DATE=$(date -u +%F)
          CERT_SHA256=$(/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs MH-Analysis-V.07.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$CERT_SHA256"
          cat > "$RUNNER_TEMP/update.json" <<EOF
          {
            "version": "$VERSION",
            "version_code": $VERSION_CODE,
            "mandatory": true,
            "download_url": "https://raw.githubusercontent.com/longidistributor-debug/MH-Analysis/android-update-channel/MH-Analysis.apk",
            "sha256": "$HASH",
            "signing_cert_sha256": "$CERT_SHA256",
            "notes": "MH Analysis $VERSION update is available.",
            "published_at": "$DATE"
          }
          EOF
          cp MH-Analysis-V.07.apk "$RUNNER_TEMP/MH-Analysis.apk"
          printf '%s\n' "$VERSION" > "$RUNNER_TEMP/VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __mh_android_update
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH-Analysis.apk" ./MH-Analysis.apk
          cp "$RUNNER_TEMP/update.json" ./update.json
          cp "$RUNNER_TEMP/VERSION" ./VERSION
          git add MH-Analysis.apk update.json VERSION
          git commit -m "MH Analysis $VERSION signed Android update channel"
          git push --force origin HEAD:android-update-channel
