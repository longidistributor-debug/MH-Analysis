name: Build MH Analysis V.01 APK
on:
  push:
    branches: [ main, v01-updater ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: python3 scripts/patch_v01_compile_fix.py
      - run: python3 scripts/patch_v01_calendar_news.py
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk MH-Analysis-V.01.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.01-APK
          path: MH-Analysis-V.01.apk
          if-no-files-found: error

      - name: Publish mobile update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          HASH=$(sha256sum MH-Analysis-V.01.apk | awk '{print $1}')
          DATE=$(date -u +%F)
          cat > "$RUNNER_TEMP/update.json" <<EOF
          {
            "version": "$VERSION",
            "version_code": $VERSION_CODE,
            "mandatory": true,
            "download_url": "https://raw.githubusercontent.com/longidistributor-debug/MH-Analysis/android-update-channel/MH-Analysis.apk",
            "sha256": "$HASH",
            "notes": "MH Analysis $VERSION update is available.",
            "published_at": "$DATE"
          }
          EOF
          cp MH-Analysis-V.01.apk "$RUNNER_TEMP/MH-Analysis.apk"
          printf '%s\n' "$VERSION" > "$RUNNER_TEMP/VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __mh_android_update
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH-Analysis.apk" ./MH-Analysis.apk
          cp "$RUNNER_TEMP/update.json" ./update.json
          cp "$RUNNER_TEMP/VERSION" ./VERSION
          git add MH-Analysis.apk update.json VERSION
          git commit -m "MH Analysis $VERSION Android update channel"
          git push --force origin HEAD:android-update-channel
