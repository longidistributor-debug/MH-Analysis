name: Build MH Analysis APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle official FCS chart library
        run: |
          rm -rf /tmp/fcs-chart app/src/main/assets/fcs-chart
          git clone --depth 1 https://github.com/fcsapi/chart-js.git /tmp/fcs-chart
          mkdir -p app/src/main/assets/fcs-chart
          cp -R /tmp/fcs-chart/src/. app/src/main/assets/fcs-chart/
          test -f app/src/main/assets/fcs-chart/fcsapi-chart.js
          test -f app/src/main/assets/fcs-chart/fcsapi-chart.css
      - run: python3 scripts/patch_v24.py
      - run: python3 scripts/patch_v25.py
      - run: python3 scripts/patch_v25_socket.py
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk MH-Analysis-v25.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-APK
          path: MH-Analysis-v25.apk
          if-no-files-found: error
