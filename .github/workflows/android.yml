name: Build MH Analysis V.01 APK
on:
  push:
    branches: [ main, v01-calendar-news ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: python3 scripts/patch_v01_compile_fix.py
      - run: python3 scripts/patch_v01_calendar_news.py
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk MH-Analysis-V.01.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.01-APK
          path: MH-Analysis-V.01.apk
          if-no-files-found: error
