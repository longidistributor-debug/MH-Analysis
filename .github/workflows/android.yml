name: Build MH Analysis APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: python3 scripts/patch_v31.py
      - run: python3 scripts/patch_alarm_v31.py
      - run: python3 scripts/patch_v32.py
      - run: python3 scripts/patch_v33.py
      - run: python3 scripts/patch_v34.py
      - run: python3 scripts/patch_v35.py
      - run: python3 scripts/patch_v36.py
      - run: python3 scripts/patch_v37_analysis.py
      - run: python3 scripts/patch_v37_runtime.py
      - run: python3 scripts/patch_v38.py
      - run: python3 scripts/patch_v39.py
      - run: python3 scripts/patch_v40_video_techniques.py
      - run: python3 scripts/patch_v41_timeframe_engine.py
      - run: python3 scripts/patch_v41_fix.py
      - run: python3 scripts/patch_v42_all_timeframes_chart_levels.py
      - run: python3 scripts/patch_v43_ui_chart_overlay.py
      - run: python3 scripts/patch_v44_clean_chart_snapshot.py
      - run: python3 scripts/patch_v45_lightweight_chart.py
      - run: python3 scripts/patch_v45_fix.py
      - run: python3 scripts/patch_v46_light_chart_sr.py
      - run: python3 scripts/patch_v47_single_signal_live_chart.py
      - run: python3 scripts/patch_v48_provider_freshness.py
      - run: python3 scripts/patch_v49_current_map_ui.py
      - run: python3 scripts/patch_v50_ui_cleanup.py
      - run: python3 scripts/patch_v51_major_structure.py
      - run: python3 scripts/patch_v52_confirmed_structure_ob_reason.py
      - run: python3 scripts/patch_v53_feed_integrity_dynamic_sr.py
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk MH-Analysis-v53.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-APK
          path: MH-Analysis-v53.apk
          if-no-files-found: error
