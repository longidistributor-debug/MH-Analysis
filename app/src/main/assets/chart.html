<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fcsapi/chart-js/src/fcsapi-chart.css">
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;overflow:hidden;font-family:Arial,sans-serif}
#fcs_chartparent{position:absolute;inset:0;width:100%;height:100%;background:#050505}
#fcs_chart{width:100%;height:100%}
#state{position:absolute;left:10px;top:8px;z-index:9999;background:rgba(0,0,0,.76);border:1px solid #333;border-radius:8px;padding:6px 9px;font-size:10px;color:#ddd;pointer-events:none}
#state b{font-size:12px;color:#fff}
#err{position:absolute;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#aaa;background:#050505;font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/gh/fcsapi/chart-js/src/fcsapi-chart.js"></script>
</head>
<body>
<div id="fcs_chartparent"><div id="fcs_chart"></div></div>
<div id="state"><b id="ticker">MS ANALYSIS</b><div id="live">Initializing live chart…</div></div>
<div id="err"></div>
<script>
let chart=null,currentSymbol='XAUUSD',currentPeriod='15m',lastSignal=null;
const state=document.getElementById('live'),ticker=document.getElementById('ticker'),err=document.getElementById('err');
function socketSymbol(s){return (String(s).toUpperCase()==='BTCUSDT')?'BINANCE:BTCUSDT':'FX:XAUUSD'}
function chartPeriod(p){p=String(p).toLowerCase();if(p==='1h'||p==='60')return'1H';if(p==='30'||p==='30m')return'30m';if(p==='15'||p==='15m')return'15m';if(p==='5'||p==='5m')return'5m';return'1m'}
function tell(s){state.textContent=s;try{AndroidLive.onSocketState(s)}catch(e){}}
function showError(s){err.textContent=s;err.style.display='flex'}
function hideError(){err.style.display='none'}
async function initLiveChart(accessKey,socketKey,symbol,period,publicKey){
  currentSymbol=symbol||currentSymbol;currentPeriod=period||currentPeriod;ticker.textContent=currentSymbol+' • '+currentPeriod;
  hideError();tell('FCS live chart connecting…');
  try{
    if(typeof FCSAPIChart==='undefined')throw new Error('FCS chart library did not load');
    const holder=document.getElementById('fcs_chart');holder.innerHTML='';
    chart=new FCSAPIChart({
      container:holder,parentid:'fcs_chartparent',accessKey:accessKey||'',socketApiKey:socketKey||'',publicKey:publicKey||'',
      symbol:socketSymbol(currentSymbol),period:chartPeriod(currentPeriod),length:220,theme:'dark',displayMode:'chartonly',
      defaultChartType:'candlestick',enableCache:true,changeURL:false,enableSocket:true,enableGrid:true,enableCrosshair:true,
      enableCrosshairLabels:true,enablePriceLine:true,enableAskBidLines:false,enableOHLCBar:true,enableHighLowLabels:true,
      enableDrawingTools:false,enableContextMenu:false,autoScale:true
    });
    tell('LIVE CHART ACTIVE • '+currentPeriod);
    setTimeout(()=>{applySignal(lastSignal);try{chart.resize()}catch(e){}},1200);
  }catch(e){tell('LIVE CHART ERROR');showError('Live chart could not start: '+(e&&e.message?e.message:e));}
}
async function switchLiveChart(symbol,period){
 currentSymbol=symbol||currentSymbol;currentPeriod=period||currentPeriod;ticker.textContent=currentSymbol+' • '+currentPeriod;hideError();
 if(!chart){tell('Live chart not initialized');return}
 try{tell('Switching '+currentPeriod+'…');chart.setSymbol(socketSymbol(currentSymbol));chart.setPeriod(chartPeriod(currentPeriod));setTimeout(()=>{tell('LIVE CHART ACTIVE • '+currentPeriod);applySignal(lastSignal)},700)}catch(e){showError('Timeframe switch failed: '+(e&&e.message?e.message:e))}
}
async function applySignal(s){
 lastSignal=s;if(typeof s==='string'){try{lastSignal=JSON.parse(s)}catch(e){lastSignal=null}}
 if(!chart)return;
 try{if(chart.clearHorizontalLines)chart.clearHorizontalLines();}catch(e){}
 if(!lastSignal)return;
 const items=[['entry','ENTRY','#2196f3','solid'],['sl','SL','#ff3b30','dashed'],['tp1','TP1','#00c853','dashed'],['tp2','TP2','#76ff03','dashed']];
 for(const [key,label,color,style] of items){const v=Number(lastSignal[key]);if(!isFinite(v))continue;try{await chart.addHorizontalLine({id:'mh-'+key,price:v,color,label,style,lineWidth:key==='entry'?2:1,textPosition:'above-left',textColor:'#ffffff',textSize:11})}catch(e){}}
}
function setSignal(s){applySignal(s)}
function renderCandles(){/* visible chart is owned by FCS; analysis candles stay native */}
function clearChart(){if(chart&&chart.clearHorizontalLines)try{chart.clearHorizontalLines()}catch(e){};lastSignal=null}
function showMessage(t){tell(t)}
window.addEventListener('resize',()=>{try{chart&&chart.resize()}catch(e){}});
</script>
</body>
</html>
