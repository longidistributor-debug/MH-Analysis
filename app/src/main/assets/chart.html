<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#wrap{position:relative;width:100%;height:100%;background:#080808}#canvas{width:100%;height:100%;display:block;touch-action:none}#head{position:absolute;left:8px;top:7px;z-index:5;background:rgba(0,0,0,.78);border:1px solid #333;border-radius:9px;padding:7px 9px;font-size:10px;max-width:235px}#head b{font-size:13px}#trend{margin-top:3px;color:#ddd;font-size:9px}#live{margin-top:3px;font-size:9px;color:#8fd6a9}#ohlc{position:absolute;right:8px;top:8px;color:#aaa;font-size:9px;background:rgba(0,0,0,.68);padding:6px 7px;border-radius:8px}.tools{position:absolute;right:8px;bottom:8px;z-index:9;display:flex;gap:5px}.tools button{background:#111;color:#fff;border:1px solid #666;border-radius:7px;padding:6px 9px;font-weight:bold}#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#aaa;font-size:13px;pointer-events:none}.hide{display:none!important}</style><script src="fcs-client-lib.js"></script></head><body><div id="wrap"><canvas id="canvas"></canvas><div id="head"><b id="ticker">MS ANALYSIS</b><br><span id="period">Live candles</span><div id="trend">Trend guide waiting...</div><div id="live">WebSocket waiting...</div></div><div id="ohlc"></div><div class="tools"><button onclick="zoom(-8)">＋</button><button onclick="zoom(8)">－</button><button onclick="resetView();draw()">RESET</button></div><div id="msg">Waiting for live market...</div></div><script>
let candles=[],signal=null,currentTicker='XAUUSD',currentPeriod='15m',viewCount=44,offset=0,dragX=null,pinchDist=null;const c=document.getElementById('canvas'),ctx=c.getContext('2d'),msg=document.getElementById('msg'),trendEl=document.getElementById('trend'),liveEl=document.getElementById('live');
const cacheByKey={};let fcs=null;let socketKey='';const tfs=['1','5','15','30','60'];const syms=['FX:XAUUSD','BINANCE:BTCUSDT'];
function ikey(t,p){return (t||'').toUpperCase()+'|'+normalizeTf(p)}function normalizeTf(x){x=(''+x).toLowerCase();if(x==='1'||x==='1m')return'1m';if(x==='5'||x==='5m')return'5m';if(x==='15'||x==='15m')return'15m';if(x==='30'||x==='30m')return'30m';if(x==='60'||x==='1h'||x==='1H')return'1h';return x}function internalSymbol(s){s=(''+s).toUpperCase();return s.endsWith('XAUUSD')?'XAUUSD':s.endsWith('BTCUSDT')?'BTCUSDT':s}function liveState(s){liveEl.textContent=s;try{AndroidLive.onSocketState(s)}catch(e){}}
function startFcsLive(key){if(!key)return;socketKey=key;if(fcs){try{fcs.disconnect()}catch(e){}}liveState('WebSocket connecting...');try{fcs=new FCSClient(key,'wss://ws-v4.fcsapi.com/ws');fcs.focusTimeout=999999;fcs.reconnectDelay=3000;fcs.reconnectlimit=20;fcs.onconnected=()=>{liveState('LIVE STREAM CONNECTED');for(const s of syms)for(const tf of tfs)fcs.join(s,tf)};fcs.onreconnect=()=>liveState('LIVE STREAM RECONNECTED');fcs.onclose=e=>liveState('LIVE STREAM RECONNECTING');fcs.onerror=e=>liveState('LIVE STREAM ERROR');fcs.onmessage=handleLive;fcs.connect().catch(()=>{liveState('LIVE STREAM RETRYING')})}catch(e){liveState('LIVE STREAM ERROR')}}
function selectLive(ticker,period){currentTicker=ticker||currentTicker;currentPeriod=normalizeTf(period||currentPeriod);document.getElementById('ticker').textContent=currentTicker;document.getElementById('period').textContent=currentPeriod+' • WebSocket live';const a=cacheByKey[ikey(currentTicker,currentPeriod)];if(a&&a.length){candles=a.slice();resetView();msg.classList.add('hide');draw()}else{candles=[];draw();showMessage('Waiting for first '+currentTicker+' • '+currentPeriod+' WebSocket candle...')}}
function handleLive(data){if(!data||data.type!=='price'||!data.prices)return;const p=data.prices,mode=(''+p.mode).toLowerCase();if(mode==='profile')return;const s=internalSymbol(data.symbol),tf=normalizeTf(data.timeframe),k=ikey(s,tf);if(mode==='initial'||mode==='candle'){const x={t:+p.t||0,o:+p.o,h:+p.h,l:+p.l,c:+p.c,v:+p.v||0};mergeLive(k,x)}else if(mode==='askbid'){const price=+p.c;if(!isFinite(price))return;let arr=cacheByKey[k]||[];if(arr.length){const last=Object.assign({},arr[arr.length-1]);last.h=Math.max(+last.h,price);last.l=Math.min(+last.l,price);last.c=price;arr[arr.length-1]=last;cacheByKey[k]=arr}else{const t=+p.t||+p.update||Math.floor(Date.now()/1000);cacheByKey[k]=[{t,o:price,h:price,l:price,c:price,v:0}]}}try{AndroidLive.onSocketMessage(JSON.stringify(data))}catch(e){}if(s===currentTicker&&tf===currentPeriod){candles=(cacheByKey[k]||[]).slice();msg.classList.add('hide');draw()}}
function mergeLive(k,x){let arr=cacheByKey[k]||[];if(arr.length&&+arr[arr.length-1].t===+x.t)arr[arr.length-1]=x;else{arr.push(x);if(arr.length>1200)arr=arr.slice(-1200)}cacheByKey[k]=arr}
function resetView(){viewCount=Math.min(44,Math.max(18,candles.length));offset=0}function clearChart(){candles=[];signal=null;offset=0;ctx.clearRect(0,0,c.width,c.height);trendEl.textContent='Trend guide waiting...';showMessage('Waiting for live market...')}function resize(){const d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*d));c.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}
function renderCandles(j,ticker,period){try{let incoming=typeof j==='string'?JSON.parse(j):j;const tf=normalizeTf(period),k=ikey(ticker,tf),live=(cacheByKey[k]||[]);if(live.length){const last=live[live.length-1],same=incoming.length&&+incoming[incoming.length-1].t===+last.t;if(same)incoming[incoming.length-1]=last;else incoming.push(last)}cacheByKey[k]=incoming.slice(-1200);currentTicker=ticker||currentTicker;currentPeriod=tf;document.getElementById('ticker').textContent=currentTicker;document.getElementById('period').textContent=currentPeriod+' • '+incoming.length+' candles • WebSocket live';if(ticker===currentTicker&&tf===currentPeriod){candles=cacheByKey[k].slice();msg.classList.add('hide');if(offset===0)resetView();draw()}}catch(e){showMessage('Chart data error')}}function showMessage(t){msg.textContent=t;msg.classList.remove('hide')}function setSignal(j){try{signal=!j?null:(typeof j==='string'?JSON.parse(j):j);draw()}catch(e){signal=null;draw()}}function visible(){const n=candles.length,count=Math.min(viewCount,n),end=Math.max(count,n-offset),start=Math.max(0,end-count);return candles.slice(start,end)}function emaSeries(data,p){if(!data.length)return[];const k=2/(p+1),out=[+data[0].c];for(let i=1;i<data.length;i++)out.push(+data[i].c*k+out[i-1]*(1-k));return out}function smaSeries(data,p){const out=[];for(let i=0;i<data.length;i++){const s=data.slice(Math.max(0,i-p+1),i+1);out.push(s.reduce((a,x)=>a+(+x.c),0)/s.length)}return out}function regression(data){const n=Math.min(24,data.length),start=data.length-n;if(n<3)return null;let sx=0,sy=0,sxy=0,sxx=0;for(let i=0;i<n;i++){const y=+data[start+i].c;sx+=i;sy+=y;sxy+=i*y;sxx+=i*i}const den=n*sxx-sx*sx;if(!den)return null;const slope=(n*sxy-sx*sy)/den;return{start,n,slope,intercept:(sy-slope*sx)/n}}function fmt(v){return !isFinite(v)?'-':Math.abs(v)>=100?v.toFixed(2):v.toFixed(5)}function series(vals,left,top,pw,ph,lo,hi,stroke,dash=[]){if(vals.length<2)return;const y=v=>top+(hi-v)/(hi-lo)*ph,step=pw/vals.length;ctx.save();ctx.strokeStyle=stroke;ctx.lineWidth=1.05;ctx.setLineDash(dash);ctx.beginPath();vals.forEach((v,i)=>{const x=left+step*(i+.5),yy=y(v);i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)});ctx.stroke();ctx.restore()}function box(text,x,y){ctx.save();ctx.font='9px Arial';const tw=ctx.measureText(text).width+10;ctx.fillStyle='rgba(0,0,0,.90)';ctx.strokeStyle='#888';ctx.lineWidth=.7;ctx.fillRect(x,y-10,tw,14);ctx.strokeRect(x,y-10,tw,14);ctx.fillStyle='#fff';ctx.fillText(text,x+5,y);ctx.restore()}
function draw(){const w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#080808';ctx.fillRect(0,0,w,h);const data=visible();if(data.length<1)return;const left=50,right=86,top=64,bottom=42,pw=Math.max(80,w-left-right),ph=h-top-bottom;let lo=Infinity,hi=-Infinity;for(const x of data){lo=Math.min(lo,+x.l);hi=Math.max(hi,+x.h)}let sigVals=[];if(signal){for(const k of ['entry','sl','tp1','tp2']){const v=+signal[k];if(isFinite(v))sigVals.push(v)}if(isFinite(+signal.fvgLow))lo=Math.min(lo,+signal.fvgLow);if(isFinite(+signal.fvgHigh))hi=Math.max(hi,+signal.fvgHigh)}if(sigVals.length&&isFinite(lo)&&isFinite(hi)){const base=Math.max(1e-9,hi-lo||1),mn=Math.min(...sigVals),mx=Math.max(...sigVals);if(mn>lo-base*2)lo=Math.min(lo,mn);if(mx<hi+base*2)hi=Math.max(hi,mx)}if(!isFinite(lo)||!isFinite(hi))return;if(hi<=lo){hi=lo+Math.max(1,Math.abs(lo)*.001)}const pad=(hi-lo)*.1||1;lo-=pad;hi+=pad;const y=v=>top+(hi-v)/(hi-lo)*ph;ctx.strokeStyle='#202020';ctx.fillStyle='#777';ctx.font='9px Arial';for(let i=0;i<=5;i++){const yy=top+ph*i/5;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(left+pw,yy);ctx.stroke();ctx.fillText(fmt(hi-(hi-lo)*i/5),2,yy+3)}const e20=emaSeries(data,20),e50=emaSeries(data,50),s20=smaSeries(data,20),s50=smaSeries(data,50);if(data.length>1){series(e20,left,top,pw,ph,lo,hi,'#f2f2f2');series(e50,left,top,pw,ph,lo,hi,'#888',[5,4]);series(s20,left,top,pw,ph,lo,hi,'#bdbdbd',[2,4]);series(s50,left,top,pw,ph,lo,hi,'#666',[2,6])}const sr=data.slice(-Math.min(26,data.length)),support=Math.min(...sr.map(x=>+x.l)),resistance=Math.max(...sr.map(x=>+x.h));for(const [v,lbl] of [[support,'S'],[resistance,'R']]){const yy=y(v);ctx.save();ctx.strokeStyle='#555';ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(left+pw,yy);ctx.stroke();ctx.restore();box(lbl+' '+fmt(v),left+4,yy-2)}const reg=regression(data);if(reg){const step=pw/data.length,x1=left+step*(reg.start+.5),x2=left+step*(reg.start+reg.n-.5),v1=reg.intercept,v2=reg.intercept+reg.slope*(reg.n-1);ctx.save();ctx.strokeStyle='#d5d5d5';ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(x1,y(v1));ctx.lineTo(x2,y(v2));ctx.stroke();ctx.restore();const tr=Math.abs(reg.slope)<((resistance-support)/Math.max(1,sr.length)*.08)?'MIXED / FLAT':reg.slope>0?'TREND UP':'TREND DOWN';trendEl.textContent=tr+' • EMA20 '+(e20[e20.length-1]>e50[e50.length-1]?'>':'<')+' EMA50 • live'}const n=data.length,step=pw/Math.max(1,n),bw=Math.max(3,Math.min(11,step*.64));for(let i=0;i<n;i++){const x=data[i],xx=left+step*(i+.5),yo=y(+x.o),yc=y(+x.c),yh=y(+x.h),yl=y(+x.l),up=+x.c>=+x.o;ctx.strokeStyle=ctx.fillStyle=up?'#25d07f':'#ff4d4d';ctx.beginPath();ctx.moveTo(xx,yh);ctx.lineTo(xx,yl);ctx.stroke();ctx.fillRect(xx-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)))}if(signal){let labels=[];for(const [k,lbl] of [['entry','ENTRY'],['sl','SL'],['tp1','TP1'],['tp2','TP2']]){const v=+signal[k];if(!isFinite(v)||v<lo||v>hi)continue;const yy=y(v);ctx.save();ctx.strokeStyle='#fff';ctx.globalAlpha=k==='entry'?1:.68;ctx.setLineDash(k==='entry'?[]:[5,4]);ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(left+pw,yy);ctx.stroke();ctx.restore();labels.push({yy,text:lbl+' '+fmt(v)})}labels.sort((a,b)=>a.yy-b.yy);for(let i=1;i<labels.length;i++)if(labels[i].yy-labels[i-1].yy<17)labels[i].yy=labels[i-1].yy+17;labels.forEach(o=>box(o.text,left+pw+5,Math.min(h-bottom-4,Math.max(top+12,o.yy))));ctx.fillStyle='#fff';ctx.font='9px Arial';ctx.fillText('SIGNAL '+(signal.state||'PENDING')+' • live lifecycle',left+6,h-12)}const last=data[data.length-1];document.getElementById('ohlc').textContent='O '+fmt(+last.o)+' H '+fmt(+last.h)+' L '+fmt(+last.l)+' C '+fmt(+last.c)}
function zoom(delta){viewCount=Math.max(16,Math.min(candles.length||220,viewCount+delta));draw()}c.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?8:-8)},{passive:false});c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);dragX=e.clientX});c.addEventListener('pointermove',e=>{if(dragX==null)return;const dx=e.clientX-dragX;if(Math.abs(dx)>8){offset=Math.max(0,Math.min(Math.max(0,candles.length-viewCount),offset+(dx>0?2:-2)));dragX=e.clientX;draw()}});c.addEventListener('pointerup',()=>dragX=null);window.addEventListener('resize',resize);setTimeout(resize,50);
</script></body></html>
