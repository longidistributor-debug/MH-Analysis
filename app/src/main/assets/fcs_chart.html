<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;background:#131722;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#wrap{position:absolute;inset:0}canvas{position:absolute;inset:0;width:100%;height:100%}#top{position:absolute;left:10px;top:8px;font-size:11px;font-weight:700;color:#d9dde5;background:rgba(8,11,17,.7);padding:5px 7px;border-radius:6px;z-index:5}#card{position:absolute;right:10px;top:10px;z-index:6;display:none;background:rgba(8,11,17,.9);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px 9px;font-size:9px;line-height:1.45}.row{white-space:nowrap}.dot{display:inline-block;width:18px;border-top:2px solid;margin-right:5px;vertical-align:middle}.entry{border-color:#f2c94c}.sl{border-color:#ff5a67;border-top-style:dashed}.tp1{border-color:#3ddc84;border-top-style:dashed}.tp2{border-color:#56d7d1;border-top-style:dashed}</style></head><body><div id="wrap"><canvas id="c"></canvas><div id="top">FCS • waiting for data</div><div id="card"></div></div><script>let candles=[],signal=null,sym='XAUUSD',tf='15m';const cv=document.getElementById('c'),ctx=cv.getContext('2d');function fmt(v){v=Number(v);return Number.isFinite(v)?(Math.abs(v)>=100?v.toFixed(2):v.toFixed(5)):'-'}function setEmptyMarket(s,p){sym=s||sym;tf=p||tf;candles=[];signal=null;document.getElementById('top').textContent='FCS '+sym+' • '+tf+' • press NEW ANALYZE';document.getElementById('card').style.display='none';draw()}function setMarketData(s,p,raw){sym=s||sym;tf=p||tf;try{candles=typeof raw==='string'?JSON.parse(raw):raw}catch(e){candles=[]}document.getElementById('top').textContent='FCS '+sym+' • '+tf+' • '+candles.length+' candles';draw()}function setSignalCard(raw){try{signal=typeof raw==='string'?JSON.parse(raw):raw}catch(e){signal=null}renderCard();draw()}function clearSignalCard(){signal=null;renderCard();draw()}function renderCard(){const e=document.getElementById('card');if(!signal){e.style.display='none';e.innerHTML='';return}e.innerHTML='<b>'+String(signal.direction||'SETUP')+' • '+String(signal.state||'')+' • '+String(signal.score||'-')+'/100</b><div class="row"><span class="dot entry"></span>ENTRY '+fmt(signal.entry)+'</div><div class="row"><span class="dot sl"></span>SL '+fmt(signal.sl)+'</div><div class="row"><span class="dot tp1"></span>TP1 '+fmt(signal.tp1)+'</div><div class="row"><span class="dot tp2"></span>TP2 '+fmt(signal.tp2)+'</div>';e.style.display='block'}function resize(){const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.floor(w*d)||cv.height!==Math.floor(h*d)){cv.width=Math.floor(w*d);cv.height=Math.floor(h*d)}ctx.setTransform(d,0,0,d,0,0);draw()}function draw(){const w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#131722';ctx.fillRect(0,0,w,h);if(!candles.length)return;const data=candles.slice(-120);let lo=Math.min(...data.map(x=>Number(x.l))),hi=Math.max(...data.map(x=>Number(x.h)));if(signal){[signal.entry,signal.sl,signal.tp1,signal.tp2].forEach(v=>{v=Number(v);if(Number.isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v)}})}let pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;const left=8,right=50,top=35,bottom=24,pw=w-left-right,ph=h-top-bottom;ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=top+ph*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();let v=hi-(hi-lo)*i/4;ctx.fillStyle='#9ba3af';ctx.font='9px Arial';ctx.fillText(fmt(v),w-right+4,y+3)}const step=pw/Math.max(data.length,1),bw=Math.max(2,Math.min(7,step*.62));const y=v=>top+(hi-Number(v))/(hi-lo)*ph;data.forEach((x,i)=>{const cx=left+step*i+step/2,yo=y(x.o),yc=y(x.c),yh=y(x.h),yl=y(x.l),up=Number(x.c)>=Number(x.o);ctx.strokeStyle=up?'#26a69a':'#ef5350';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(cx,yh);ctx.lineTo(cx,yl);ctx.stroke();ctx.fillRect(cx-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)))});if(signal){[['entry','#f2c94c','ENTRY'],['sl','#ff5a67','SL'],['tp1','#3ddc84','TP1'],['tp2','#56d7d1','TP2']].forEach(([k,col,label])=>{let v=Number(signal[k]);if(!Number.isFinite(v))return;let yy=y(v);ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;if(k!=='entry')ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=col;ctx.font='bold 9px Arial';ctx.fillText(label+' '+fmt(v),left+3,yy-3);ctx.restore()})}}window.addEventListener('resize',resize);setTimeout(resize,0);</script></body></html>
