<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;background:#131722;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}#wrap{position:absolute;inset:0;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#top{position:absolute;left:10px;top:8px;font-size:11px;font-weight:700;color:#d9dde5;background:rgba(8,11,17,.72);padding:5px 7px;border-radius:6px;z-index:5}#tools{position:absolute;left:10px;bottom:8px;z-index:7;display:flex;gap:5px}.tool{font-size:9px;font-weight:700;color:#d9dde5;background:rgba(8,11,17,.82);border:1px solid rgba(255,255,255,.14);padding:6px 8px;border-radius:6px}#card{position:absolute;right:10px;top:10px;z-index:6;display:none;background:rgba(8,11,17,.9);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px 9px;font-size:9px;line-height:1.45}.row{white-space:nowrap}.dot{display:inline-block;width:18px;border-top:2px solid;margin-right:5px;vertical-align:middle}.entry{border-color:#f2c94c}.sl{border-color:#ff5a67;border-top-style:dashed}.tp1{border-color:#3ddc84;border-top-style:dashed}.tp2{border-color:#56d7d1;border-top-style:dashed}#tip{position:absolute;display:none;z-index:9;pointer-events:none;background:rgba(8,11,17,.94);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 7px;font-size:9px;line-height:1.4;color:#e6e9ef}</style></head><body><div id="wrap"><canvas id="c"></canvas><div id="top">Waiting for data</div><div id="card"></div><div id="tools"><div class="tool" onclick="resetView()">RESET</div><div class="tool" onclick="focusSignal()">FOCUS</div><div class="tool" onclick="toggleLevels()">LEVELS</div></div><div id="tip"></div></div><script>
let candles=[],signal=null,sym='XAUUSD',tf='15m',visibleCount=120,offset=0,showLevels=true,cross=null;const cv=document.getElementById('c'),ctx=cv.getContext('2d'),tip=document.getElementById('tip');let drag=false,lastX=0,pinchDist=0,longTimer=null,moved=false;
function fmt(v){v=Number(v);return Number.isFinite(v)?(Math.abs(v)>=100?v.toFixed(2):v.toFixed(5)):'-'}function timeText(t){let ms=Number(t);if(ms<1e12)ms*=1000;const d=new Date(ms);return isNaN(d)?'':d.toLocaleString()}
function setEmptyMarket(s,p){sym=s||sym;tf=p||tf;candles=[];signal=null;offset=0;visibleCount=120;document.getElementById('top').textContent=sym+' • '+tf+' • press NEW ANALYZE';document.getElementById('card').style.display='none';draw()}
function setMarketData(s,p,raw){sym=s||sym;tf=p||tf;try{candles=typeof raw==='string'?JSON.parse(raw):raw}catch(e){candles=[]}offset=0;visibleCount=Math.min(120,Math.max(30,candles.length));document.getElementById('top').textContent=sym+' • '+tf+' • '+candles.length+' candles';draw()}
function setSignalCard(raw){try{signal=typeof raw==='string'?JSON.parse(raw):raw}catch(e){signal=null}renderCard();focusSignal()}
function clearSignalCard(){signal=null;renderCard();draw()}function toggleLevels(){showLevels=!showLevels;draw()}
function renderCard(){const e=document.getElementById('card');if(!signal){e.style.display='none';e.innerHTML='';return}e.innerHTML='<b>'+String(signal.direction||'SETUP')+' • '+String(signal.state||'')+' • '+String(signal.score||'-')+'/100</b><div class="row"><span class="dot entry"></span>ENTRY '+fmt(signal.entry)+'</div><div class="row"><span class="dot sl"></span>SL '+fmt(signal.sl)+'</div><div class="row"><span class="dot tp1"></span>TP1 '+fmt(signal.tp1)+'</div><div class="row"><span class="dot tp2"></span>TP2 '+fmt(signal.tp2)+'</div>';e.style.display='block'}
function resetView(){offset=0;visibleCount=Math.min(120,Math.max(30,candles.length));cross=null;tip.style.display='none';draw()}function focusSignal(){if(!candles.length){draw();return}visibleCount=Math.min(Math.max(45,Math.round(candles.length*.42)),90);offset=0;cross=null;tip.style.display='none';draw()}
function viewData(){if(!candles.length)return[];const count=Math.min(candles.length,Math.max(20,Math.round(visibleCount)));const maxOffset=Math.max(0,candles.length-count);offset=Math.max(0,Math.min(maxOffset,offset));const end=candles.length-Math.round(offset);const start=Math.max(0,end-count);return candles.slice(start,end)}
function resize(){const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.floor(w*d)||cv.height!==Math.floor(h*d)){cv.width=Math.floor(w*d);cv.height=Math.floor(h*d)}ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){const w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#131722';ctx.fillRect(0,0,w,h);const data=viewData();if(!data.length)return;let lo=Math.min(...data.map(x=>Number(x.l))),hi=Math.max(...data.map(x=>Number(x.h)));if(signal&&showLevels){[signal.entry,signal.sl,signal.tp1,signal.tp2].forEach(v=>{v=Number(v);if(Number.isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v)}})}let pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;const left=8,right=50,top=35,bottom=30,pw=w-left-right,ph=h-top-bottom;ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;for(let i=0;i<5;i++){let yy=top+ph*i/4;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();let v=hi-(hi-lo)*i/4;ctx.fillStyle='#9ba3af';ctx.font='9px Arial';ctx.fillText(fmt(v),w-right+4,yy+3)}const step=pw/Math.max(data.length,1),bw=Math.max(2,Math.min(9,step*.62));const y=v=>top+(hi-Number(v))/(hi-lo)*ph;data.forEach((x,i)=>{const cx=left+step*i+step/2,yo=y(x.o),yc=y(x.c),yh=y(x.h),yl=y(x.l),up=Number(x.c)>=Number(x.o);ctx.strokeStyle=up?'#26a69a':'#ef5350';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(cx,yh);ctx.lineTo(cx,yl);ctx.stroke();ctx.fillRect(cx-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)))});if(signal&&showLevels){[['entry','#f2c94c','ENTRY'],['sl','#ff5a67','SL'],['tp1','#3ddc84','TP1'],['tp2','#56d7d1','TP2']].forEach(([k,col,label])=>{let v=Number(signal[k]);if(!Number.isFinite(v))return;let yy=y(v);ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;if(k!=='entry')ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=col;ctx.font='bold 9px Arial';ctx.fillText(label+' '+fmt(v),left+3,yy-3);ctx.restore()})}if(cross){const x=Math.max(left,Math.min(w-right,cross.x)),cy=Math.max(top,Math.min(h-bottom,cross.y));ctx.save();ctx.strokeStyle='rgba(220,225,235,.55)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,h-bottom);ctx.moveTo(left,cy);ctx.lineTo(w-right,cy);ctx.stroke();ctx.restore();const idx=Math.max(0,Math.min(data.length-1,Math.floor((x-left)/step)));const q=data[idx];if(q){tip.innerHTML='<b>'+sym+' • '+tf+'</b><br>'+timeText(q.t)+'<br>O '+fmt(q.o)+' &nbsp; H '+fmt(q.h)+'<br>L '+fmt(q.l)+' &nbsp; C '+fmt(q.c);tip.style.display='block';tip.style.left=Math.min(w-150,x+9)+'px';tip.style.top=Math.max(38,cy-65)+'px'}}}
function dist(a,b){const dx=a.clientX-b.clientX,dy=a.clientY-b.clientY;return Math.sqrt(dx*dx+dy*dy)}
cv.addEventListener('touchstart',e=>{e.preventDefault();moved=false;if(e.touches.length===2){pinchDist=dist(e.touches[0],e.touches[1]);clearTimeout(longTimer);return}drag=true;lastX=e.touches[0].clientX;const x=e.touches[0].clientX,y=e.touches[0].clientY;longTimer=setTimeout(()=>{cross={x,y};drag=false;draw()},520)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();moved=true;clearTimeout(longTimer);if(e.touches.length===2){const d=dist(e.touches[0],e.touches[1]);if(pinchDist>0){const factor=pinchDist/d;visibleCount=Math.max(20,Math.min(candles.length||180,visibleCount*factor));pinchDist=d;draw()}return}if(drag&&e.touches.length===1){const x=e.touches[0].clientX,dx=x-lastX;lastX=x;const data=viewData(),pw=Math.max(1,cv.clientWidth-58),step=pw/Math.max(1,data.length);offset+=-dx/step;draw()}if(cross&&e.touches.length===1){cross={x:e.touches[0].clientX,y:e.touches[0].clientY};draw()}},{passive:false});
cv.addEventListener('touchend',e=>{clearTimeout(longTimer);drag=false;pinchDist=0},{passive:false});let lastTap=0;cv.addEventListener('click',()=>{const n=Date.now();if(n-lastTap<330)resetView();lastTap=n});
cv.addEventListener('wheel',e=>{e.preventDefault();visibleCount=Math.max(20,Math.min(candles.length||180,visibleCount*(e.deltaY>0?1.12:.88)));draw()},{passive:false});window.addEventListener('resize',resize);setTimeout(resize,0);
</script></body></html>
