<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#131722;overflow:hidden;font-family:Arial,sans-serif}
#tvroot{position:absolute;inset:0;background:#131722}
#widget{position:absolute;inset:0;z-index:1}
#signalCard{position:absolute;right:10px;top:10px;z-index:70;display:none;width:166px;background:rgba(9,12,18,.88);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:8px 9px;color:#fff;font-size:9px;line-height:1.45;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.28)}
#signalCard .head{font-size:11px;font-weight:800;margin-bottom:4px}
.level{display:flex;align-items:center;gap:6px;white-space:nowrap}.sw{width:22px;height:0;border-top:2px solid #fff;display:inline-block}.sw.sl,.sw.tp1,.sw.tp2{border-top-style:dashed}.sw.entry{border-color:#f2c94c}.sw.sl{border-color:#ff5a67}.sw.tp1{border-color:#3ddc84}.sw.tp2{border-color:#56d7d1}
#apiState{position:absolute;left:8px;bottom:7px;z-index:65;display:none;background:rgba(9,12,18,.72);border:1px solid rgba(255,255,255,.10);border-radius:6px;padding:3px 6px;color:#b9c0cb;font-size:8px;pointer-events:none}
</style>
</head>
<body>
<div id="tvroot">
  <div id="widget"></div>
  <div id="signalCard"></div>
  <div id="apiState"></div>
</div>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
let currentSymbol='OANDA:XAUUSD', currentInterval='15';
let tvWidget=null, chartApi=null, lastSignal=null, exactApi=false, shapeIds=[];
let reloadToken=0;
function mapSymbol(s){s=String(s||'').toUpperCase();return s==='BTCUSDT'?'BINANCE:BTCUSDT':'OANDA:XAUUSD'}
function mapInterval(p){p=String(p||'15m').toLowerCase();if(p==='1m'||p==='1')return'1';if(p==='5m'||p==='5')return'5';if(p==='15m'||p==='15')return'15';if(p==='30m'||p==='30')return'30';return'60'}
function fmt(v){const n=Number(v);return Number.isFinite(n)?(Math.abs(n)>=100?n.toFixed(2):n.toFixed(5)):'-'}
function setApiState(t,show){const e=document.getElementById('apiState');e.textContent=t||'';e.style.display=show?'block':'none'}
function removeNativeShapes(){
  if(!chartApi){shapeIds=[];return}
  const ids=shapeIds.slice();shapeIds=[];
  ids.forEach(id=>{try{if(typeof chartApi.removeEntity==='function')chartApi.removeEntity(id);else if(typeof chartApi.removeShape==='function')chartApi.removeShape(id)}catch(e){}})
}
function rememberShape(v){
  if(v&&typeof v.then==='function'){v.then(id=>{if(id!=null)shapeIds.push(id)}).catch(()=>{exactApi=false;setApiState('',false)})}
  else if(v!=null)shapeIds.push(v)
}
function drawNativeLine(price,color,dashed,label){
  if(!exactApi||!chartApi||!Number.isFinite(Number(price)))return false;
  try{
    const r=chartApi.createShape({price:Number(price)},{shape:'horizontal_line',text:String(label||''),lock:true,disableSelection:true,disableSave:true,disableUndo:true,overrides:{linecolor:color,linestyle:dashed?2:0,linewidth:2,showPrice:true,textcolor:color,fontsize:11,bold:true}});
    rememberShape(r);return true;
  }catch(e){exactApi=false;return false}
}
function renderSignalCard(s){
  const el=document.getElementById('signalCard');
  if(!s){el.style.display='none';el.innerHTML='';return}
  const dir=String(s.direction||'SETUP').toUpperCase();
  el.innerHTML='<div class="head">'+dir+' • '+String(s.state||'')+' • '+String(s.score||'-')+'/100</div>'+
    '<div class="level"><span class="sw entry"></span>ENTRY '+fmt(s.entry)+'</div>'+
    '<div class="level"><span class="sw sl"></span>SL '+fmt(s.sl)+'</div>'+
    '<div class="level"><span class="sw tp1"></span>TP1 '+fmt(s.tp1)+'</div>'+
    '<div class="level"><span class="sw tp2"></span>TP2 '+fmt(s.tp2)+'</div>';
  el.style.display='block';
}
function drawSignal(s){
  lastSignal=s;renderSignalCard(s);removeNativeShapes();
  if(!s)return;
  if(exactApi&&chartApi){
    const dir=String(s.direction||'').toUpperCase();
    const ok=[
      drawNativeLine(s.entry,'#f2c94c',false,'ENTRY '+dir+' '+fmt(s.entry)),
      drawNativeLine(s.sl,'#ff5a67',true,'SL '+fmt(s.sl)),
      drawNativeLine(s.tp1,'#3ddc84',true,'TP1 '+fmt(s.tp1)),
      drawNativeLine(s.tp2,'#56d7d1',true,'TP2 '+fmt(s.tp2))
    ].every(Boolean);
    if(ok)setApiState('TV exact price guides',true);else setApiState('',false);
  }else{
    setApiState('',false);
  }
}
function getChartApi(){
  try{if(tvWidget&&typeof tvWidget.activeChart==='function')return tvWidget.activeChart();if(tvWidget&&typeof tvWidget.chart==='function')return tvWidget.chart()}catch(e){}
  return null;
}
function onWidgetReady(token){
  if(token!==reloadToken)return;
  chartApi=getChartApi();
  exactApi=!!(chartApi&&typeof chartApi.createShape==='function');
  if(lastSignal)drawSignal(lastSignal);
}
function buildWidget(symbol,period,token){
  if(token!==reloadToken)return;
  if(!window.TradingView||typeof TradingView.widget!=='function'){
    setTimeout(()=>buildWidget(symbol,period,token),500);return;
  }
  const host=document.getElementById('widget');host.innerHTML='';
  const id='tv_chart_'+token+'_'+Date.now();
  const node=document.createElement('div');node.id=id;node.style.width='100%';node.style.height='100%';host.appendChild(node);
  try{
    tvWidget=new TradingView.widget({
      autosize:true,width:'100%',height:'100%',symbol:mapSymbol(symbol),interval:mapInterval(period),timezone:'Asia/Karachi',theme:'dark',style:'1',locale:'en',toolbar_bg:'#131722',enable_publishing:false,hide_top_toolbar:false,hide_side_toolbar:false,allow_symbol_change:false,save_image:false,details:false,hotlist:false,calendar:false,withdateranges:false,container_id:id
    });
    if(tvWidget&&typeof tvWidget.onChartReady==='function')tvWidget.onChartReady(()=>onWidgetReady(token));
    else setTimeout(()=>onWidgetReady(token),2600);
  }catch(e){setApiState('TradingView chart unavailable',true)}
}
function loadTradingView(symbol,period){
  currentSymbol=mapSymbol(symbol);currentInterval=mapInterval(period);reloadToken++;shapeIds=[];chartApi=null;exactApi=false;
  buildWidget(symbol,period,reloadToken);
}
function setSignalCard(raw){
  if(!raw){clearSignalCard();return}
  let s=raw;try{if(typeof raw==='string')s=JSON.parse(raw)}catch(e){clearSignalCard();return}
  drawSignal(s)
}
function clearSignalCard(){lastSignal=null;removeNativeShapes();renderSignalCard(null);setApiState('',false)}
</script>
</body>
</html>
