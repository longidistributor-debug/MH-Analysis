<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#131722;overflow:hidden;font-family:Arial,sans-serif}
#tvroot{position:absolute;inset:0;background:#131722}
#widget{position:absolute;inset:0;z-index:1}
#signalLayer{position:absolute;inset:0;z-index:40;pointer-events:none;display:none}
.sigLine{position:absolute;left:8px;right:58px;height:0;border-top-width:1.3px;border-top-style:solid;opacity:.96}
.sigLine.dashed{border-top-style:dashed}
.sigTag{position:absolute;right:-50px;top:-9px;min-width:46px;padding:1px 3px;border-radius:3px;background:rgba(19,23,34,.90);font-size:8px;line-height:14px;font-weight:700;text-align:left;white-space:nowrap;letter-spacing:.1px}
.sigLine.entry{border-color:#f2c94c}.sigLine.entry .sigTag{color:#f7df86}
.sigLine.sl{border-color:#ff5a67}.sigLine.sl .sigTag{color:#ff808a}
.sigLine.tp1{border-color:#3ddc84}.sigLine.tp1 .sigTag{color:#66e69c}
.sigLine.tp2{border-color:#56d7d1}.sigLine.tp2 .sigTag{color:#7ee4df}
</style>
</head>
<body>
<div id="tvroot">
  <div id="widget" class="tradingview-widget-container"></div>
  <div id="signalLayer"></div>
</div>
<script>
let currentSymbol='OANDA:XAUUSD', currentInterval='15', lastSignal=null;
function mapSymbol(s){s=String(s||'').toUpperCase();return s==='BTCUSDT'?'BINANCE:BTCUSDT':'OANDA:XAUUSD'}
function mapInterval(p){p=String(p||'15m').toLowerCase();if(p==='1m'||p==='1')return'1';if(p==='5m'||p==='5')return'5';if(p==='15m'||p==='15')return'15';if(p==='30m'||p==='30')return'30';return'60'}
function loadTradingView(symbol,period){
  currentSymbol=mapSymbol(symbol);currentInterval=mapInterval(period);
  const host=document.getElementById('widget');host.innerHTML='';
  const inner=document.createElement('div');inner.className='tradingview-widget-container__widget';inner.style.width='100%';inner.style.height='100%';host.appendChild(inner);
  const script=document.createElement('script');script.type='text/javascript';script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';script.async=true;
  script.innerHTML=JSON.stringify({autosize:true,symbol:currentSymbol,interval:currentInterval,timezone:'Asia/Karachi',theme:'dark',backgroundColor:'#131722',style:'1',locale:'en',hide_top_toolbar:false,hide_side_toolbar:true,allow_symbol_change:false,save_image:false,calendar:false,details:false,hotlist:false,withdateranges:false,support_host:'https://www.tradingview.com'});
  host.appendChild(script);
  setTimeout(()=>{if(lastSignal)drawSignal(lastSignal)},700);
}
function fmt(v){const n=Number(v);return Number.isFinite(n)?(Math.abs(n)>=100?n.toFixed(2):n.toFixed(5)):'-'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function drawSignal(s){
  const layer=document.getElementById('signalLayer');layer.innerHTML='';
  const vals=[Number(s.entry),Number(s.sl),Number(s.tp1),Number(s.tp2)].filter(Number.isFinite);
  if(vals.length<2){layer.style.display='none';return}
  let low=Number(s.viewLow),high=Number(s.viewHigh);
  if(!Number.isFinite(low)||!Number.isFinite(high)||high<=low){
    low=Math.min.apply(null,vals);high=Math.max.apply(null,vals);const pad=Math.max((high-low)*.35,Math.abs(high)*.0015,0.0005);low-=pad;high+=pad;
  }
  const pad=(high-low)*.06;low-=pad;high+=pad;
  const h=Math.max(260,document.documentElement.clientHeight||window.innerHeight||500);const top=64,bottom=46,plot=Math.max(120,h-top-bottom);
  const y=p=>clamp(top+(high-p)/(high-low)*plot,top+5,h-bottom-5);
  const dir=String(s.direction||'').toUpperCase();
  const items=[
    {k:'ENTRY',p:Number(s.entry),c:'entry',dash:false,label:'ENTRY '+(dir?dir+' ':'')+fmt(s.entry)},
    {k:'SL',p:Number(s.sl),c:'sl',dash:true,label:'SL '+fmt(s.sl)},
    {k:'TP1',p:Number(s.tp1),c:'tp1',dash:true,label:'TP1 '+fmt(s.tp1)},
    {k:'TP2',p:Number(s.tp2),c:'tp2',dash:true,label:'TP2 '+fmt(s.tp2)}
  ].filter(x=>Number.isFinite(x.p));
  items.forEach(x=>{const d=document.createElement('div');d.className='sigLine '+x.c+(x.dash?' dashed':'');d.style.top=y(x.p)+'px';const t=document.createElement('span');t.className='sigTag';t.textContent=x.label;d.appendChild(t);layer.appendChild(d)});
  layer.style.display='block';
}
function setSignalCard(raw){
  if(!raw){clearSignalCard();return}
  let s=raw;try{if(typeof raw==='string')s=JSON.parse(raw)}catch(e){clearSignalCard();return}
  lastSignal=s;drawSignal(s)
}
function clearSignalCard(){lastSignal=null;const layer=document.getElementById('signalLayer');layer.innerHTML='';layer.style.display='none'}
window.addEventListener('resize',()=>{if(lastSignal)drawSignal(lastSignal)})
</script>
</body>
</html>
