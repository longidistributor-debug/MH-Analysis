<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#wrap{position:relative;width:100%;height:100%;background:#080808}#canvas{width:100%;height:100%;display:block;touch-action:none}#head{position:absolute;left:8px;top:7px;z-index:5;background:rgba(0,0,0,.80);border:1px solid #333;border-radius:9px;padding:7px 9px;font-size:10px;max-width:250px}#head b{font-size:13px}#trend{margin-top:3px;color:#ddd;font-size:9px}#live{margin-top:3px;font-size:9px;color:#8fd6a9}#ohlc{position:absolute;right:8px;top:8px;color:#aaa;font-size:9px;background:rgba(0,0,0,.70);padding:6px 7px;border-radius:8px}.tools{position:absolute;right:8px;bottom:8px;z-index:9;display:flex;gap:5px}.tools button{background:#111;color:#fff;border:1px solid #666;border-radius:7px;padding:6px 9px;font-weight:bold}#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#aaa;font-size:13px;pointer-events:none}.hide{display:none!important}
</style>
</head>
<body><div id="wrap"><canvas id="canvas"></canvas><div id="head"><b id="ticker">MS ANALYSIS</b><br><span id="period">Native WebSocket live candle</span><div id="trend">Trend guide waiting...</div><div id="live">Live feed waiting...</div></div><div id="ohlc"></div><div class="tools"><button onclick="zoom(-8)">＋</button><button onclick="zoom(8)">－</button><button onclick="resetView();draw()">RESET</button></div><div id="msg">Waiting for live market feed...</div></div>
<script>
let candles=[],signal=null,currentTicker='XAUUSD',currentPeriod='15m',viewCount=44,offset=0,dragX=null;
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),msg=document.getElementById('msg'),trendEl=document.getElementById('trend'),liveEl=document.getElementById('live'),ohlcEl=document.getElementById('ohlc');
function normTf(x){x=(''+x).toLowerCase();if(x==='1'||x==='1m')return'1m';if(x==='5'||x==='5m')return'5m';if(x==='15'||x==='15m')return'15m';if(x==='30'||x==='30m')return'30m';if(x==='60'||x==='1h')return'1h';return x}
function normSym(x){x=(''+x).toUpperCase();return x.endsWith('BTCUSDT')?'BTCUSDT':'XAUUSD'}
function sec(t){t=+t||Math.floor(Date.now()/1000);return t>99999999999?Math.floor(t/1000):t}
function setNativeState(s){liveEl.textContent=s||'Live feed waiting...'}
function showMessage(t){msg.textContent=t;msg.classList.remove('hide')}function hideMessage(){msg.classList.add('hide')}
function selectLive(symbol,period){currentTicker=normSym(symbol);currentPeriod=normTf(period);document.getElementById('ticker').textContent=currentTicker+' • '+currentPeriod;document.getElementById('period').textContent='Native WebSocket live candle';candles=[];signal=null;resetView();draw();showMessage('Waiting for '+currentTicker+' • '+currentPeriod+' live candle…')}
function renderCandles(j,ticker,period){try{const tf=normTf(period),sym=normSym(ticker);if(sym!==currentTicker||tf!==currentPeriod)return;let a=typeof j==='string'?JSON.parse(j):j;if(!Array.isArray(a))return;const live=candles.length?candles[candles.length-1]:null;candles=a.map(x=>({t:sec(x.t),o:+x.o,h:+x.h,l:+x.l,c:+x.c,v:+x.v||0})).filter(x=>isFinite(x.c));if(live){const i=candles.findIndex(x=>x.t===live.t);if(i>=0)candles[i]=live;else candles.push(live)}candles.sort((a,b)=>a.t-b.t);if(candles.length>1200)candles=candles.slice(-1200);resetView();hideMessage();draw()}catch(e){showMessage('Chart history merge error')}}
function pushNativeLive(symbol,period,j){try{const sym=normSym(symbol),tf=normTf(period);if(sym!==currentTicker||tf!==currentPeriod)return;const x=typeof j==='string'?JSON.parse(j):j;const q={t:sec(x.t),o:+x.o,h:+x.h,l:+x.l,c:+x.c,v:+x.v||0};if(!isFinite(q.c))return;if(!isFinite(q.o))q.o=q.c;if(!isFinite(q.h))q.h=q.c;if(!isFinite(q.l))q.l=q.c;const i=candles.findIndex(v=>v.t===q.t);if(i>=0)candles[i]=q;else{candles.push(q);candles.sort((a,b)=>a.t-b.t);if(candles.length>1200)candles=candles.slice(-1200)}hideMessage();if(offset===0&&candles.length>viewCount*2)viewCount=Math.max(24,Math.min(viewCount,candles.length));draw()}catch(e){}}
function setSignal(j){try{signal=!j?null:(typeof j==='string'?JSON.parse(j):j);draw()}catch(e){signal=null;draw()}}
function clearChart(){signal=null;draw()}
function resetView(){viewCount=Math.min(44,Math.max(18,candles.length||44));offset=0}
function resize(){const d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*d));c.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}
function visible(){const n=candles.length,count=Math.min(viewCount,n),end=Math.max(count,n-offset),start=Math.max(0,end-count);return candles.slice(start,end)}
function emaSeries(data,p){if(!data.length)return[];const k=2/(p+1),out=[+data[0].c];for(let i=1;i<data.length;i++)out.push(+data[i].c*k+out[i-1]*(1-k));return out}
function smaSeries(data,p){const out=[];for(let i=0;i<data.length;i++){const s=data.slice(Math.max(0,i-p+1),i+1);out.push(s.reduce((a,x)=>a+(+x.c),0)/s.length)}return out}
function regression(data){const n=Math.min(24,data.length),start=data.length-n;if(n<3)return null;let sx=0,sy=0,sxy=0,sxx=0;for(let i=0;i<n;i++){const y=+data[start+i].c;sx+=i;sy+=y;sxy+=i*y;sxx+=i*i}const den=n*sxx-sx*sx;if(!den)return null;const slope=(n*sxy-sx*sy)/den;return{start,n,slope,intercept:(sy-slope*sx)/n}}
function fmt(v){return !isFinite(v)?'-':Math.abs(v)>=100?v.toFixed(2):v.toFixed(5)}
function series(vals,left,top,pw,ph,lo,hi,stroke,dash=[]){if(vals.length<2)return;const y=v=>top+(hi-v)/(hi-lo)*ph,step=pw/vals.length;ctx.save();ctx.strokeStyle=stroke;ctx.lineWidth=1.05;ctx.setLineDash(dash);ctx.beginPath();vals.forEach((v,i)=>{const x=left+step*(i+.5),yy=y(v);i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)});ctx.stroke();ctx.restore()}
function box(text,x,y){ctx.save();ctx.font='9px Arial';const tw=ctx.measureText(text).width+10;ctx.fillStyle='rgba(0,0,0,.92)';ctx.strokeStyle='#888';ctx.lineWidth=.7;ctx.fillRect(x,y-10,tw,14);ctx.strokeRect(x,y-10,tw,14);ctx.fillStyle='#fff';ctx.fillText(text,x+5,y);ctx.restore()}
function draw(){const w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#080808';ctx.fillRect(0,0,w,h);const data=visible();if(!data.length){ohlcEl.textContent='';trendEl.textContent='Trend guide waiting...';return}const left=50,right=86,top=64,bottom=42,pw=Math.max(80,w-left-right),ph=h-top-bottom;let lo=Infinity,hi=-Infinity;for(const x of data){lo=Math.min(lo,+x.l);hi=Math.max(hi,+x.h)}const sigVals=[];if(signal){for(const k of ['entry','sl','tp1','tp2']){const v=+signal[k];if(isFinite(v))sigVals.push(v)}}if(sigVals.length&&isFinite(lo)&&isFinite(hi)){const base=Math.max(1e-9,hi-lo||1),mn=Math.min(...sigVals),mx=Math.max(...sigVals);if(mn>lo-base*2)lo=Math.min(lo,mn);if(mx<hi+base*2)hi=Math.max(hi,mx)}if(hi<=lo)hi=lo+Math.max(1,Math.abs(lo)*.001);const pad=(hi-lo)*.10||1;lo-=pad;hi+=pad;const y=v=>top+(hi-v)/(hi-lo)*ph;ctx.strokeStyle='#202020';ctx.fillStyle='#777';ctx.font='9px Arial';for(let i=0;i<=5;i++){const yy=top+ph*i/5;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(left+pw,yy);ctx.stroke();ctx.fillText(fmt(hi-(hi-lo)*i/5),2,yy+3)}const e20=emaSeries(data,20),e50=emaSeries(data,50),s20=smaSeries(data,20),s50=smaSeries(data,50);if(data.length>1){series(e20,left,top,pw,ph,lo,hi,'#f2f2f2');series(e50,left,top,pw,ph,lo,hi,'#888',[5,4]);series(s20,left,top,pw,ph,lo,hi,'#bdbdbd',[2,4]);series(s50,left,top,pw,ph,lo,hi,'#666',[2,6])}const sr=data.slice(-Math.min(26,data.length)),support=Math.min(...sr.map(x=>+x.l)),resistance=Math.max(...sr.map(x=>+x.h));for(const [v,lbl] of [[support,'S'],[resistance,'R']]){const yy=y(v);ctx.save();ctx.strokeStyle='#555';ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(left+pw,yy);ctx.stroke();ctx.restore();box(lbl+' '+fmt(v),left+4,yy-2)}const reg=regression(data);if(reg){const step=pw/data.length,x1=left+step*(reg.start+.5),x2=left+step*(reg.start+reg.n-.5),v1=reg.intercept,v2=reg.intercept+reg.slope*(reg.n-1);ctx.save();ctx.strokeStyle='#d5d5d5';ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(x1,y(v1));ctx.lineTo(x2,y(v2));ctx.stroke();ctx.restore();const tr=Math.abs(reg.slope)<((resistance-support)/Math.max(1,sr.length)*.08)?'MIXED / FLAT':reg.slope>0?'TREND UP':'TREND DOWN';trendEl.textContent=tr+' • EMA20 '+(e20[e20.length-1]>e50[e50.length-1]?'>':'<')+' EMA50'}const n=data.length,step=pw/Math.max(1,n),bw=Math.max(3,Math.min(11,step*.64));for(let i=0;i<n;i++){const x=data[i],xx=left+step*(i+.5),yo=y(+x.o),yc=y(+x.c),yh=y(+x.h),yl=y(+x.l),up=+x.c>=+x.o;ctx.strokeStyle=ctx.fillStyle=up?'#25d07f':'#ff4d4d';ctx.beginPath();ctx.moveTo(xx,yh);ctx.lineTo(xx,yl);ctx.stroke();ctx.fillRect(xx-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)))}if(signal){const labels=[];for(const [k,lbl] of [['entry','ENTRY'],['sl','SL'],['tp1','TP1'],['tp2','TP2']]){const v=+signal[k];if(!isFinite(v)||v<lo||v>hi)continue;const yy=y(v);ctx.save();ctx.strokeStyle='#fff';ctx.globalAlpha=k==='entry'?1:.70;ctx.setLineDash(k==='entry'?[]:[5,4]);ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(left+pw,yy);ctx.stroke();ctx.restore();labels.push({yy,text:lbl+' '+fmt(v)})}labels.sort((a,b)=>a.yy-b.yy);for(let i=1;i<labels.length;i++)if(labels[i].yy-labels[i-1].yy<17)labels[i].yy=labels[i-1].yy+17;labels.forEach(o=>box(o.text,left+pw+5,Math.min(h-bottom-4,Math.max(top+12,o.yy))))}const last=data[data.length-1];ohlcEl.textContent='O '+fmt(+last.o)+' H '+fmt(+last.h)+' L '+fmt(+last.l)+' C '+fmt(+last.c)}
function zoom(delta){viewCount=Math.max(16,Math.min(candles.length||220,viewCount+delta));draw()}c.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?8:-8)},{passive:false});c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);dragX=e.clientX});c.addEventListener('pointermove',e=>{if(dragX==null)return;const dx=e.clientX-dragX;if(Math.abs(dx)>8){offset=Math.max(0,Math.min(Math.max(0,candles.length-viewCount),offset+(dx>0?2:-2)));dragX=e.clientX;draw()}});c.addEventListener('pointerup',()=>dragX=null);window.addEventListener('resize',resize);setTimeout(resize,50);
</script></body></html>
